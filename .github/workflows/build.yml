name: build

on:
  push:
    branches-ignore: ['ci/shots']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swift-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build (debug)
        run: swift build -c debug
      - name: Build (release)
        run: swift build -c release
      - name: Package app
        run: scripts/build-app.sh
      - name: Render screenshots (headless Metal)
        continue-on-error: true
        run: |
          mkdir -p shots
          APP=build/RhineLab.app/Contents/MacOS/RhineLab
          $APP --shot shots/scene-archive.png --size 1920x1080
          $APP --shot shots/scene-viewer-exploded.png --viewer --exploded --size 1920x1080
          for t in 2.3 4.6 7.7 15.9 18.5; do
            $APP --shot shots/ui-boot-$t.png --ui boot --time $t --size 1920x1080 || echo "boot $t failed"
          done
          for mode in archive detail viewer viewer-exploded search saved settings; do
            $APP --shot shots/ui-$mode.png --ui $mode --size 1920x1080 || echo "ui $mode failed"
          done
          for mode in archive detail viewer-exploded settings; do
            $APP --shot shots/ui-$mode-dark.png --ui $mode --dark --size 1920x1080 || echo "ui $mode dark failed"
          done
          ls -la shots
      - name: Look sweep
        continue-on-error: true
        run: |
          APP=build/RhineLab.app/Contents/MacOS/RhineLab
          sweep() { name=$1; shift; env "$@" $APP --shot shots/sweep-$name-archive.png --ui archive --size 1920x1080 || true; env "$@" $APP --shot shots/sweep-$name-detail.png --ui detail --size 1920x1080 || true; }
          sweep dist06 RL_ATTEN_DIST=0.6
          sweep darkamber RL_ATTEN=b89060 RL_ATTEN_DIST=0.8
          sweep key24 RL_KEY=2.4
          sweep env35 RL_ENV=0.35 RL_HEMI=0.45
          sweep back RL_KEY_POS=-10,8,-14 RL_KEY=2.2
          sweep ao RL_AO=1.2 RL_AO_RADIUS=0.8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
          if-no-files-found: warn
      # The screenshots also go to a throwaway branch so they can be fetched with plain git.
      - name: Publish screenshots to ci/shots
        if: always()
        run: |
          set -e
          rm -rf /tmp/shots-repo && mkdir -p /tmp/shots-repo
          cp -R shots/. /tmp/shots-repo/ 2>/dev/null || true
          echo "$GITHUB_SHA" > /tmp/shots-repo/SHA
          cd /tmp/shots-repo
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci/shots
          git add -A
          git commit -q -m "screenshots for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" ci/shots
