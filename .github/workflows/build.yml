name: build

on:
  push:
    branches-ignore: ['ci/shots']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swift-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build (debug)
        run: swift build -c debug
      - name: Build (release)
        run: swift build -c release
      - name: Package app
        run: scripts/build-app.sh
      - name: Render screenshots (headless Metal)
        continue-on-error: true
        run: |
          mkdir -p shots
          APP=build/RhineLab.app/Contents/MacOS/RhineLab
          $APP --shot shots/scene-archive.png --size 1920x1080
          $APP --shot shots/scene-viewer-exploded.png --viewer --exploded --size 1920x1080
          for t in 2.3 4.6 7.7 15.9 18.5; do
            $APP --shot shots/ui-boot-$t.png --ui boot --time $t --size 1920x1080 || echo "boot $t failed"
          done
          for mode in archive detail viewer viewer-exploded search saved settings; do
            $APP --shot shots/ui-$mode.png --ui $mode --size 1920x1080 || echo "ui $mode failed"
          done
          for mode in archive detail viewer-exploded settings; do
            $APP --shot shots/ui-$mode-dark.png --ui $mode --dark --size 1920x1080 || echo "ui $mode dark failed"
          done
          # Look sweep: fog / AO / key light variants for side-by-side comparison with the web version.
          sweep() { name=$1; shift; env "$@" $APP --shot shots/sweep-$name-archive.png --size 1920x1080; env "$@" $APP --shot shots/sweep-$name-detail.png --detail --size 1920x1080; }
          COMMON="RL_FOG_NEAR=8 RL_FOG_FAR=30 RL_DFOG_NEAR=2 RL_DFOG_FAR=18 RL_AO=4.5"
          sweep base RL_FOG_NEAR=2
          sweep v1 $COMMON RL_KEY=2.2 RL_FILL=0.3 RL_HEMI=0.45 RL_ENV=0.4
          sweep v2 $COMMON RL_KEY=2.2 RL_FILL=0.3 RL_HEMI=0.45 RL_ENV=0.4 RL_EXPOSURE=1.1
          sweep v3 $COMMON RL_KEY=2.6 RL_FILL=0.25 RL_HEMI=0.4 RL_ENV=0.35 RL_EXPOSURE=1.05 RL_AO=5
          sweep v4 $COMMON RL_KEY=2.6 RL_FILL=0.25 RL_HEMI=0.4 RL_ENV=0.48 RL_EXPOSURE=1.05 RL_AO=5
          sweep v5 $COMMON RL_KEY=2.2 RL_FILL=0.3 RL_HEMI=0.45 RL_ENV=0.4 RL_EXPOSURE=1.1 RL_AO=6 RL_AO_RADIUS=1.5
          sweep v2dof5 $COMMON RL_KEY=2.2 RL_FILL=0.3 RL_HEMI=0.45 RL_ENV=0.4 RL_EXPOSURE=1.1 RL_DOF=0.5
          sweep v2dof0 $COMMON RL_KEY=2.2 RL_FILL=0.3 RL_HEMI=0.45 RL_ENV=0.4 RL_EXPOSURE=1.1 RL_DOF=0
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
          if-no-files-found: warn
      # The screenshots also go to a throwaway branch so they can be fetched with plain git.
      - name: Publish screenshots to ci/shots
        if: always()
        run: |
          set -e
          rm -rf /tmp/shots-repo && mkdir -p /tmp/shots-repo
          cp -R shots/. /tmp/shots-repo/ 2>/dev/null || true
          echo "$GITHUB_SHA" > /tmp/shots-repo/SHA
          cd /tmp/shots-repo
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci/shots
          git add -A
          git commit -q -m "screenshots for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" ci/shots
